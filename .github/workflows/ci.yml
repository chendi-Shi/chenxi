name: Python checks
on:
  push:
    branches-ignore: ['codex/daily-state']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,web,cloud]"
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m pytest --cov=research_agent --cov-report=term-missing --cov-report=xml
      - run: python -m build --no-isolation
      - run: research-agent --data-dir artifacts/ci-data ingest samples/demo.json
      - run: research-agent --data-dir artifacts/ci-data run --out artifacts/ci-reports
