name: Daily delivery health
on:
  schedule:
    - cron: '50 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chenxi-daily-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: python -m pip install -c requirements-dev.lock '.[cloud]'
      - name: Check durable daily delivery evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAILY_CONFIG_JSON: ${{ secrets.DAILY_CONFIG_JSON }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: python -m research_agent.cloud health
